[package]
name = "openapirator"
version = "0.0.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11"
heck = "0.5"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.1.5"
